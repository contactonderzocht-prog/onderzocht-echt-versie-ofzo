backend:
  name: git-gateway
  branch: main

media_folder: "images/uploads"
public_folder: "/images/uploads"

collections:
  - name: "artikelen"
    label: "Artikelen"
    folder: "content/artikelen"
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    fields:
      - { label: "Titel van het Artikel", name: "title", widget: "string" }
      - { label: "Publicatiedatum", name: "date", widget: "datetime" }
      - { 
          label: "Categorie", 
          name: "category", 
          widget: "select", 
          options: ["Pretparken", "Geschiedenis van Objecten", "Algemeen"] 
        }
      - { label: "Kopfoto / Afbeelding", name: "image", widget: "image", required: false }
      - { label: "Korte Samenvatting", name: "summary", widget: "text", required: false }
      - { label: "Volledige Inhoud (Markdown)", name: "body", widget: "markdown" }

  - name: "enquetes"
    label: "Enquêtes & Links"
    folder: "content/enquetes"
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    fields:
      - { label: "Titel van de Enquête", name: "title", widget: "string" }
      - { label: "Publicatiedatum", name: "date", widget: "datetime" }
      - { label: "Kopfoto / Afbeelding", name: "image", widget: "image", required: false }
      - { label: "Korte Samenvatting", name: "summary", widget: "text", required: false }
      - { label: "Volledige Inhoud (Markdown)", name: "body", widget: "markdown" }

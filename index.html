<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Onderzocht | Pretparken, Historie & Enquêtes</title>
  
  <meta name="theme-color" content="#0f172a">
  <meta name="mobile-web-app-capable" content="yes">

  <!-- Netlify Identity Widget -->
  <script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>

  <style>
    :root {
      --bg-color: #0f172a;
      --card-bg: #1e293b;
      --accent: #f59e0b;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --badge-active: #22c55e;
    }

    * { box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg-color);
      color: var(--text);
      margin: 0;
      padding: 0;
      line-height: 1.5;
    }

    header {
      background-color: rgba(30, 41, 59, 0.95);
      position: sticky;
      top: 0;
      z-index: 1000;
      border-bottom: 2px solid var(--accent);
      padding: 0.75rem 1.5rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .logo {
      font-size: 1.6rem;
      font-weight: 900;
      color: var(--text);
      text-decoration: none;
      cursor: pointer;
    }
    .logo span { color: var(--accent); }

    .social-links a {
      color: var(--text-muted);
      text-decoration: none;
      font-size: 0.85rem;
      font-weight: 600;
      margin-left: 1rem;
      transition: color 0.2s;
    }

    .social-links a:hover { color: var(--accent); }

    .category-bar {
      background: #1a2332;
      display: flex;
      justify-content: center;
      gap: 0.5rem;
      padding: 0.6rem 1rem;
      overflow-x: auto;
      border-bottom: 1px solid rgba(255, 255, 255, 0.05);
    }

    .cat-btn {
      color: var(--text);
      border: none;
      font-size: 0.85rem;
      font-weight: 700;
      padding: 0.4rem 0.9rem;
      border-radius: 20px;
      background: rgba(255, 255, 255, 0.05);
      white-space: nowrap;
      cursor: pointer;
      transition: all 0.2s;
    }

    .cat-btn:hover, .cat-btn.active {
      background: var(--accent);
      color: #000;
    }

    .container {
      max-width: 1050px;
      margin: 0 auto;
      padding: 1.5rem 1rem;
    }

    .section-title {
      font-size: 1.3rem;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      border-left: 4px solid var(--accent);
      padding-left: 0.75rem;
      margin: 2.5rem 0 1.25rem 0;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
      gap: 1.5rem;
    }

    .card {
      background: var(--card-bg);
      border-radius: 8px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      border: 1px solid rgba(255, 255, 255, 0.05);
      transition: transform 0.2s, border-color 0.2s;
    }

    .card:hover {
      transform: translateY(-3px);
      border-color: var(--accent);
    }

    .card-body {
      padding: 1.25rem;
      display: flex;
      flex-direction: column;
      flex-grow: 1;
    }

    .badge {
      align-self: flex-start;
      background: var(--accent);
      color: #000;
      font-size: 0.7rem;
      font-weight: 800;
      text-transform: uppercase;
      padding: 0.2rem 0.5rem;
      border-radius: 4px;
      margin-bottom: 0.75rem;
    }

    .card h3 {
      margin: 0 0 0.5rem 0;
      font-size: 1.1rem;
      line-height: 1.3;
    }

    .card p {
      color: var(--text-muted);
      font-size: 0.9rem;
      margin: 0 0 1rem 0;
      flex-grow: 1;
    }

    .btn {
      display: inline-block;
      text-align: center;
      background: rgba(255, 255, 255, 0.1);
      color: var(--text);
      text-decoration: none;
      padding: 0.5rem 1rem;
      border-radius: 4px;
      font-size: 0.85rem;
      font-weight: 600;
      transition: background 0.2s;
    }

    .btn:hover { background: var(--accent); color: #000; }

    footer {
      text-align: center;
      padding: 2rem;
      color: var(--text-muted);
      font-size: 0.8rem;
      border-top: 1px solid rgba(255, 255, 255, 0.05);
      margin-top: 4rem;
    }
  </style>
</head>
<body>

  <header>
    <div class="logo">ONDERZOCHT<span>.</span></div>
    <div class="social-links">
      <a href="https://www.instagram.com/onderzocht_/" target="_blank">📸 @onderzocht_</a>
      <a href="mailto:contact.onderzocht@gmail.com">✉️ E-mail</a>
    </div>
  </header>

  <div class="container">
    <div class="section-title">📜 Nieuwste Artikelen & Onderzoeken</div>
    <div id="artikelen-grid" class="grid">
      <p style="color: var(--text-muted);">Artikelen laden uit het CMS...</p>
    </div>
  </div>

  <footer>
    &copy; Onderzocht - Alle rechten voorbehouden.
  </footer>

  <script>
    // Haal gepubliceerde artikelen op via de GitHub API
    async function loadCMSArticles() {
      const grid = document.getElementById('artikelen-grid');
      try {
        const response = await fetch('https://api.github.com/repos/contactonderzocht-prog/onderzocht-echt-versie-ofzo/contents/content/artikelen');
        
        if (!response.ok) {
          grid.innerHTML = '<p style="color: var(--text-muted);">Nog geen gepubliceerde artikelen gevonden.</p>';
          return;
        }

        const files = await response.json();
        grid.innerHTML = '';

        for (const file of files) {
          if (file.name.endsWith('.md')) {
            const rawRes = await fetch(file.download_url);
            const content = await rawRes.text();

            // Lees Frontmatter uit Markdown
            const titleMatch = content.match(/title:\s*["']?(.*?)["']?\n/);
            const summaryMatch = content.match(/summary:\s*["']?(.*?)["']?\n/);
            const categoryMatch = content.match(/category:\s*["']?(.*?)["']?\n/);

            const title = titleMatch ? titleMatch[1] : 'Geen titel';
            const summary = summaryMatch ? summaryMatch[1] : 'Geen samenvatting';
            const category = categoryMatch ? categoryMatch[1] : 'Artikel';

            const cardHtml = `
              <div class="card">
                <div class="card-body">
                  <span class="badge">${category}</span>
                  <h3>${title}</h3>
                  <p>${summary}</p>
                  <a href="${file.html_url}" target="_blank" class="btn">Bekijk op GitHub</a>
                </div>
              </div>
            `;
            grid.innerHTML += cardHtml;
          }
        }
      } catch (err) {
        grid.innerHTML = '<p style="color: var(--text-muted);">Er is een fout opgetreden bij het laden van de artikelen.</p>';
      }
    }

    loadCMSArticles();

    if (window.netlifyIdentity) {
      window.netlifyIdentity.on("init", user => {
        if (!user) {
          window.netlifyIdentity.on("login", () => {
            document.location.href = "/admin/";
          });
        }
      });
    }
  </script>
</body>
</html>
